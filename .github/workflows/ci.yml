name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # The package: Pkg.test() on the oldest supported Julia and the newest.
  # test/runtests.jl runs Aqua's package-quality checks, then the three
  # suites under test/ (TESTING.md says what each protects). About a
  # minute of precompilation, then seconds; 15 covers a cold cache.
  test:
    name: Pkg.test on Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  measure:
    name: Run every measurement script end to end
    runs-on: ubuntu-latest
    # First run precompiles FrankWolfe.jl's own dependency tree (it pulls in
    # MathOptInterface, StaticArrays and more), which took about a minute
    # locally; measurement/run.jl and microbenchmark/run.jl themselves are
    # seconds, run_prefix.jl's full sweep took about two minutes locally,
    # run_lifecycle.jl's sweep-and-time about 30 seconds, run_pattern_key_reps.jl's
    # about 20 seconds (see MEASURING.md). The four correctness tests under microbenchmark/
    # add about 20 seconds total (test_fold_quality.jl,
    # at ~13s, is the only one of the four that isn't sub-second: it
    # generates 40,000 real Birkhoff atoms across five trials).
    # measurement/run.jl also runs pairwise Frank-Wolfe
    # and blended conditional gradients, whose non-lazy Birkhoff n=60 runs
    # take 66 s and 130 s locally, so the harness step alone is about five
    # minutes and the whole job about twelve on a shared runner; 30 covers
    # a cold cache and a slower one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - uses: julia-actions/cache@v3

      # Two environments, one per script folder (measurement/Project.toml,
      # microbenchmark/Project.toml): both hold FrankWolfe.jl, which the
      # package itself must never depend on. The guide's demo runs in the
      # package's own environment, since it needs nothing beyond it.
      - name: Instantiate the harness environments
        run: |
          julia --project=measurement -e 'using Pkg; Pkg.instantiate()'
          julia --project=microbenchmark -e 'using Pkg; Pkg.instantiate()'

      - name: The measurement harness runs end to end
        run: |
          julia --project=measurement measurement/run.jl
          test -s measurement/results.csv
          test "$(wc -l < measurement/results.csv)" -eq 4
          head -1 measurement/results.csv | grep -q "lookup_share"
          head -1 measurement/results.csv | grep -q "certified_absent"
          test -s measurement/results_algorithms.csv
          test "$(wc -l < measurement/results_algorithms.csv)" -eq 10
          head -1 measurement/results_algorithms.csv | grep -q "^algorithm,"

      # The one number in the measurement that is a claim rather than a
      # timing: the certificate never contradicted the scan, in any run of
      # any algorithm. A nonzero `unsound` column means the argument in
      # METHOD.md is wrong on this platform, and that has to stop the build.
      - name: The certificate never contradicted the scan
        run: |
          awk -F, 'NR > 1 && $NF != 0 { print "unsound certificate in", $0; bad = 1 } END { exit bad }' measurement/results.csv
          awk -F, 'NR > 1 && $NF != 0 { print "unsound certificate in", $0; bad = 1 } END { exit bad }' measurement/results_algorithms.csv

      - name: The microbenchmark sweep runs end to end
        run: |
          julia --project=microbenchmark microbenchmark/run.jl
          test -s microbenchmark/results.csv
          head -1 microbenchmark/results.csv | grep -q "scan_miss_ns"

      # Not a timing check either, for the same reason as the two steps
      # above: this confirms the prefix-hashing sweep still runs end to end
      # against whatever FrankWolfe.jl version Project.toml resolves to,
      # and that all three results_prefix_*.csv files still have the
      # columns REJECTED.md's section 2 describes.
      - name: The prefix-hashing sweep runs end to end
        run: |
          julia --project=microbenchmark microbenchmark/run_prefix.jl
          test -s microbenchmark/results_prefix_timing.csv
          test -s microbenchmark/results_prefix_collisions.csv
          test -s microbenchmark/results_prefix_crossover.csv
          head -1 microbenchmark/results_prefix_timing.csv | grep -q "querytype"
          head -1 microbenchmark/results_prefix_collisions.csv | grep -q "bucket_collision_rate"
          head -1 microbenchmark/results_prefix_crossover.csv | grep -q "crossover_size"

      # The one thing this repository asserts rather than just runs: that
      # the instrumented find_atom (instrumentation.jl) and the scan
      # find_atom actually is (active_set.jl in the resolved FrankWolfe.jl)
      # still agree, so a version bump that changes the loop is caught
      # rather than silently timed as if it hadn't.
      - name: The instrumented lookup still matches a real one
        run: |
          julia --project=measurement -e '
            include("measurement/instrumentation.jl")
            using .LookupInstrumentation, FrankWolfe
            as = FrankWolfe.ActiveSet([(1.0, [1.0, 2.0]), (0.0, [3.0, 4.0])])
            @assert FrankWolfe.find_atom(as, [3.0, 4.0]) == 2
            @assert FrankWolfe.find_atom(as, [9.0, 9.0]) == -1
            @assert lookup_calls() == 2
            @assert lookup_hits() == 1
            println("instrumentation.jl: correctness checks passed")
          '

      # A real pass/fail check, not a "still runs" one: every @test in
      # test_soundness.jl throws on failure, so this is the one CI step
      # that would actually catch a sparse-pattern key or trie key
      # regression on the signed-zero hazard, not just a crash.
      - name: The signed-zero soundness tests pass
        run: julia --project=microbenchmark microbenchmark/test_soundness.jl

      # Not a timing check, for the same reason as the other sweeps above:
      # confirms the lookup+insert+deletion-repair lifecycle sweep still
      # runs end to end and that its three results_*.csv files still have
      # the columns README.md's lifecycle section describes.
      - name: The lifecycle sweep runs end to end
        run: |
          julia --project=microbenchmark microbenchmark/run_lifecycle.jl
          test -s microbenchmark/results_lifecycle_collisions.csv
          test -s microbenchmark/results_lifecycle_timing.csv
          test -s microbenchmark/results_lifecycle_total.csv
          test -s microbenchmark/results_sparse_pattern_collisions.csv
          head -1 microbenchmark/results_lifecycle_collisions.csv | grep -q "atom_collision_rate"
          head -1 microbenchmark/results_lifecycle_timing.csv | grep -q "delete_repair_ns"
          head -1 microbenchmark/results_lifecycle_total.csv | grep -q "total_ns_per_iter"
          head -1 microbenchmark/results_sparse_pattern_collisions.csv | grep -q "n_buckets"

      # A real pass/fail check, not a "still runs" one, same reason as the
      # signed-zero step above: every @test in test_pattern_key_reps.jl
      # throws on failure, and this is the one CI step that would actually
      # catch a UInt64-fold or NTuple regression on the collision-safety
      # property, not just a crash.
      - name: The pattern-key representation collision-safety tests pass
        run: julia --project=microbenchmark microbenchmark/test_pattern_key_reps.jl

      # Not a timing check, for the same reason as the other sweeps above:
      # confirms the three-representation allocation-and-time sweep still
      # runs end to end and that its four results_pattern_key_reps_*.csv
      # files still have the columns DECISIONS.md's "The pattern key's integer representations"
      # section describes.
      - name: The pattern-key representation sweep runs end to end
        run: |
          julia --project=microbenchmark microbenchmark/run_pattern_key_reps.jl
          test -s microbenchmark/results_pattern_key_reps_timing.csv
          test -s microbenchmark/results_pattern_key_reps_allocations.csv
          test -s microbenchmark/results_pattern_key_reps_collisions.csv
          test -s microbenchmark/results_pattern_key_reps_total.csv
          head -1 microbenchmark/results_pattern_key_reps_timing.csv | grep -q "delete_repair_ns"
          head -1 microbenchmark/results_pattern_key_reps_allocations.csv | grep -q "lookup_allocs"
          head -1 microbenchmark/results_pattern_key_reps_collisions.csv | grep -q "atom_collision_rate"
          head -1 microbenchmark/results_pattern_key_reps_total.csv | grep -q "total_bytes_per_iter"

      # The correctness-test stage's own four correctness tests, TESTING.md
      # documents what each one protects and what none of them cover yet.
      # All four are real pass/fail checks, like the two @test steps
      # above: every failure here means the folded pattern key actually
      # disagreed with the scan, not that a script merely crashed.

      # The one invariant that matters, checked as a property rather than
      # examples: for any atom set and any query, the structure returns
      # exactly what the linear scan returns. Seeds x sizes (0-500) x k
      # (2/4/8/16) x all three alphabets, plus a dedicated duplicates
      # testset.
      - name: The structure-vs-scan equivalence property tests pass
        run: julia --project=microbenchmark microbenchmark/test_equivalence.jl

      # Nobody tested `active_set_cleanup!`'s `deleteat!` shifting every
      # later index down by one before this branch. Randomised
      # insert/delete sequences, checked against a fresh scan after every
      # single operation, so a later "optimisation" to the repair logic
      # that breaks index validity fails here, not silently.
      - name: The insert/delete lifecycle tests pass
        run: julia --project=microbenchmark microbenchmark/test_lifecycle.jl

      # Sparse atoms must route to the folded pattern key and dense atoms
      # to the value-prefix hash, the same dispatch shape `_unsafe_equal`
      # itself already has (one method on `Array`, one on
      # `AbstractSparseArray`), and both must still agree with the scan.
      - name: The sparse/dense dispatch tests pass
        run: julia --project=microbenchmark microbenchmark/test_dispatch.jl

      # The comparison this stage asked for: whether the hand-written
      # incremental fold clusters, measured at narrowed bit widths against
      # both Julia's own `hash` and the birthday prediction. Prints the
      # comparison table either way; only fails if the fold is clustering.
      - name: The fold-quality-vs-birthday tests pass
        run: julia --project=microbenchmark microbenchmark/test_fold_quality.jl

      # The guide (guide/): two algorithms a newcomer can read, with the
      # membership question answered three ways side by side. Its test runs
      # under Pkg.test above; the narrated demo is run here so it cannot rot.
      - name: The guide's demo runs
        run: julia --project=. guide/run.jl

      # Not a timing check, like the other sweeps: confirms the certificate
      # sweep still runs against whatever FrankWolfe.jl version resolves,
      # and that both results files keep the columns README.md describes.
      - name: The certificate sweep runs end to end
        run: |
          julia --project=microbenchmark microbenchmark/run_certificate.jl
          test -s microbenchmark/results_certificate_timing.csv
          test -s microbenchmark/results_certificate_total.csv
          head -1 microbenchmark/results_certificate_timing.csv | grep -q "lookup_ns"
          head -1 microbenchmark/results_certificate_total.csv | grep -q "total_ns_per_iter"
